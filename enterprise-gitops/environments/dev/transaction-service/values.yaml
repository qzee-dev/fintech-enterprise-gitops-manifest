replicaCount: 2

image:
  repository: "123456789012.dkr.ecr.us-east-1.amazonaws.com/fintech-platform/transaction-service"
  tag: "1.0.0"
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3003
  targetPort: 3003

healthChecks:
  path: /health
  livenessInitialDelaySeconds: 30
  readinessInitialDelaySeconds: 10

resources:
  requests:
    cpu: 150m
    memory: 384Mi
  limits:
    cpu: 800m
    memory: 768Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

kafka:
  enabled: true
  bootstrapServers: "kafka:29092"

keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 6
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: "kafka:29092"
        consumerGroup: "transaction-service-group"
        topic: "transactions"
        lagThreshold: "10"
        offsetResetPolicy: "latest"

serviceAccount:
  create: true
  name: ""

env:
  - name: NODE_ENV
    value: "dev"
  - name: ENVIRONMENT
    value: "dev"

envFrom: []
volumes: []
volumeMounts: []
affinity: {}
tolerations: []
nodeSelector: {}

ingress:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngress: []
  allowEgress:
    - ports:
        - protocol: UDP
          port: 53
    - ports:
        - protocol: TCP
          port: 29092
