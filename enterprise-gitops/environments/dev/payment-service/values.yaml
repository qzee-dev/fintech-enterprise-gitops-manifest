replicaCount: 2

image:
  repository: "123456789012.dkr.ecr.us-east-1.amazonaws.com/payment-service"
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "dev"
  - name: ENVIRONMENT
    value: "dev"

ingress:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
