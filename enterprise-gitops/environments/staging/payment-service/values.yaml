replicaCount: 2

image:
  repository: "123456789012.dkr.ecr.eu-west-1.amazonaws.com/payment-service"
  tag: "8-a31f92c"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "staging"

ingress:
  enabled: false
