replicaCount: 3

image:
  repository: "123456789012.dkr.ecr.us-east-1.amazonaws.com/payment-service"
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

serviceAccount:
  create: true
  name: ""

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "staging"
  - name: ENVIRONMENT
    value: "staging"

ingress:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
