replicaCount: 3

image:
  repository: "AWS_ACCOUNT_ID_REQUIRED.dkr.ecr.us-east-1.amazonaws.com/fintech-platform/api-gateway"
  tag: "1.0.0"
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

healthChecks:
  path: /health
  livenessInitialDelaySeconds: 30
  readinessInitialDelaySeconds: 10

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

kafka:
  enabled: false
  bootstrapServers: ""

keda:
  enabled: false
  minReplicaCount: 3
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  triggers: []

serviceAccount:
  create: true
  name: ""

env:
  - name: NODE_ENV
    value: "staging"
  - name: ENVIRONMENT
    value: "staging"

envFrom: []
volumes: []
volumeMounts: []
affinity: {}
tolerations: []
nodeSelector: {}

ingress:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  allowIngress: []
  allowEgress: []
