replicaCount: 2

image:
  repository: "AWS_ACCOUNT_ID_REQUIRED.dkr.ecr.us-east-1.amazonaws.com/fintech-platform/notification-service"
  tag: "1.0.0"
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3006
  targetPort: 3006

healthChecks:
  path: /health
  livenessInitialDelaySeconds: 30
  readinessInitialDelaySeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

kafka:
  enabled: true
  bootstrapServers: "kafka:29092"

keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 5
  pollingInterval: 30
  cooldownPeriod: 300
  cpuUtilization: 70
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: "kafka:29092"
        consumerGroup: "notification-service-group"
        topic: "transaction-completed"
        lagThreshold: "10"
        offsetResetPolicy: "latest"
    - type: kafka
      metadata:
        bootstrapServers: "kafka:29092"
        consumerGroup: "notification-service-group"
        topic: "payment-completed"
        lagThreshold: "10"
        offsetResetPolicy: "latest"
    - type: kafka
      metadata:
        bootstrapServers: "kafka:29092"
        consumerGroup: "notification-service-group"
        topic: "payment-initiated"
        lagThreshold: "10"
        offsetResetPolicy: "latest"
    - type: kafka
      metadata:
        bootstrapServers: "kafka:29092"
        consumerGroup: "notification-service-group"
        topic: "fraud-alert"
        lagThreshold: "10"
        offsetResetPolicy: "latest"

serviceAccount:
  create: true
  name: ""

env:
  - name: NODE_ENV
    value: "staging"
  - name: ENVIRONMENT
    value: "staging"

envFrom: []
volumes: []
volumeMounts: []
affinity: {}
tolerations: []
nodeSelector: {}

ingress:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowIngress: []
  allowEgress:
    - ports:
        - protocol: UDP
          port: 53
    - ports:
        - protocol: TCP
          port: 29092
