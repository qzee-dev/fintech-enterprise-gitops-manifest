replicaCount: 3

image:
  repository: "123456789012.dkr.ecr.eu-west-1.amazonaws.com/payment-service"
  tag: "8-a31f92c"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "production"

ingress:
  enabled: false
