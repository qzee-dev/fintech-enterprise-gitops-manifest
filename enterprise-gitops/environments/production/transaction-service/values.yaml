replicaCount: 4

image:
  repository: "AWS_ACCOUNT_ID_REQUIRED.dkr.ecr.us-east-1.amazonaws.com/fintech-platform/transaction-service"
  tag: "1.0.0"
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3003
  targetPort: 3003

healthChecks:
  path: /health
  livenessInitialDelaySeconds: 30
  readinessInitialDelaySeconds: 10

resources:
  requests:
    cpu: 600m
    memory: 1536Mi
  limits:
    cpu: 2500m
    memory: 2560Mi

autoscaling:
  enabled: false
  minReplicas: 4
  maxReplicas: 15
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

kafka:
  enabled: true
  bootstrapServers: "kafka:29092"

keda:
  enabled: true
  minReplicaCount: 4
  maxReplicaCount: 15
  pollingInterval: 30
  cooldownPeriod: 300
  cpuUtilization: 70
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: "kafka:29092"
        consumerGroup: "transaction-service-group"
        topic: "transactions"
        lagThreshold: "10"
        offsetResetPolicy: "latest"

serviceAccount:
  create: true
  name: ""

env:
  - name: NODE_ENV
    value: "production"
  - name: ENVIRONMENT
    value: "production"

envFrom: []
volumes: []
volumeMounts: []
affinity: {}
tolerations: []
nodeSelector: {}

ingress:
  enabled: false

podDisruptionBudget:
  enabled: true
  minAvailable: 3

networkPolicy:
  enabled: true
  allowIngress: []
  allowEgress:
    - ports:
        - protocol: UDP
          port: 53
    - ports:
        - protocol: TCP
          port: 29092
