{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}

  policyTypes:
    - Ingress
    - Egress

  ingress:
    {{- if .Values.networkPolicy.allowIngress }}
    {{- toYaml .Values.networkPolicy.allowIngress | nindent 4 }}
    {{- else }}
    # Default: allow from ingress controller only
    - from:
      - namespaceSelector:
          matchLabels:
            name: ingress-nginx
      ports:
      - protocol: TCP
        port: {{ .Values.service.targetPort }}
    {{- end }}

  egress:
    {{- if .Values.networkPolicy.allowEgress }}
    {{- toYaml .Values.networkPolicy.allowEgress | nindent 4 }}
    {{- else }}
    # Default: allow to DNS and external services
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: UDP
        port: 53
    - to:
      - podSelector: {}
      ports:
      - protocol: TCP
        port: 443
    {{- end }}
{{- end }}
